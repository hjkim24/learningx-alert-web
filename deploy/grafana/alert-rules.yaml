apiVersion: 1
groups:
    - orgId: 1
      name: learningx-alert
      folder: ""
      interval: 1m
      rules:
        - uid: lx-scheduler-stalled
          title: 스케줄러 멈춤
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 900
                to: 0
              datasourceUid: grafanacloud-prom
              model:
                datasource:
                    type: prometheus
                    uid: grafanacloud-prom
                expr: sum(increase(learningx_scheduler_scans_total{outcome="ok"}[5m]))
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 1
                        type: lt
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: Alerting
          execErrState: Error
          for: 2m
          annotations:
            description: '{{ with $values.A }}최근 5분 스캔 {{ humanize .Value }}회 (정상이면 5회 안팎){{ else }}최근 5분 스캔 신호 없음{{ end }}'
            summary: 5분 동안 스케줄러 신호가 없어요. 서버나 scheduler 컨테이너를 확인하세요.
          labels:
            service: learningx-alert
          isPaused: false
          notification_settings:
            receiver: Discord
        - uid: lx-runs-failed
          title: 예약 알림 실패
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 900
                to: 0
              datasourceUid: grafanacloud-prom
              model:
                datasource:
                    type: prometheus
                    uid: grafanacloud-prom
                expr: sum(increase(learningx_runs_total{status=~"failed|needs_review|interrupted"}[15m]))
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0
                        type: gt
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: Error
          annotations:
            description: '{{ with $values.A }}최근 15분 동안 {{ humanize .Value }}건{{ end }}'
            summary: 최근 15분 안에 실패하거나 확인이 필요한 예약 알림이 있어요. 실행 기록을 확인하세요.
          labels:
            service: learningx-alert
          isPaused: false
          notification_settings:
            receiver: Discord
        - uid: lx-site-down
          title: 사이트 응답 없음
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 900
                to: 0
              datasourceUid: grafanacloud-prom
              model:
                datasource:
                    type: prometheus
                    uid: grafanacloud-prom
                expr: time() - max(timestamp(httpcheck_status{http_status_class="2xx", http_status_code=~"2.."}))
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 180
                        type: gt
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: Alerting
          execErrState: Error
          for: 1m
          annotations:
            description: '{{ with $values.A }}마지막 정상 응답 {{ humanize .Value }}초 전{{ else }}헬스체크 기록 없음 (collector 확인){{ end }}'
            summary: 3분 넘게 /healthz/가 정상 응답하지 않아요. 서버나 caddy 컨테이너를 확인하세요.
          labels:
            service: learningx-alert
          isPaused: false
          notification_settings:
            receiver: Discord
        - uid: lx-feedback-received
          title: 새 피드백
          condition: C
          data:
            - refId: A
              queryType: instant
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: grafanacloud-logs
              model:
                expr: sum(count_over_time({service_name="learningx-alert-web"} |= "feedback received" [5m]))
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                queryType: instant
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0
                        type: gt
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: Error
          annotations:
            description: '{{ with $values.A }}최근 5분 동안 {{ humanize .Value }}건{{ end }}'
            summary: 새 의견·오류 제보가 들어왔어요. 서버에서 manage.py list_feedback으로 확인하세요.
          labels:
            service: learningx-alert
          isPaused: false
          notification_settings:
            receiver: Discord
        - uid: lx-school-capacity
          title: 학교 정원 80% 이상
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: grafanacloud-prom
              model:
                expr: max by (school) (learningx_school_connections) / (max by (school) (learningx_school_capacity) > 0)
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                refId: A
            - refId: B
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: grafanacloud-prom
              model:
                expr: max by (school) (learningx_school_connections)
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                refId: B
            - refId: D
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: grafanacloud-prom
              model:
                expr: max by (school) (learningx_school_capacity)
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                refId: D
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0.799
                        type: gt
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: Error
          for: 5m
          annotations:
            description: 연결 {{ with $values.B }}{{ humanize .Value }}{{ end }}명 / 정원 {{ with $values.D }}{{ humanize .Value }}{{ end }}명
            summary: '{{ if eq $labels.school "hanyang" }}한양대학교{{ else if eq $labels.school "skku" }}성균관대학교{{ else }}{{ $labels.school }}{{ end }} 연결이 정원의 80%를 넘었어요. 정원(SCHOOL_MAX_USERS)을 늘릴지 정하세요.'
          labels:
            service: learningx-alert
          isPaused: false
          notification_settings:
            receiver: Discord
        - uid: lx-push-failures
          title: 브라우저 푸시 실패 증가
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 86400
                to: 0
              datasourceUid: grafanacloud-prom
              model:
                expr: (sum(increase(learningx_deliveries_total{kind="webpush", status=~"definitely_failed|needs_review"}[24h])) >= 2) / clamp_min(sum(increase(learningx_deliveries_total{kind="webpush"}[24h])), 1)
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                refId: A
            - refId: B
              relativeTimeRange:
                from: 86400
                to: 0
              datasourceUid: grafanacloud-prom
              model:
                expr: sum(increase(learningx_deliveries_total{kind="webpush", status=~"definitely_failed|needs_review"}[24h]))
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                refId: B
            - refId: D
              relativeTimeRange:
                from: 86400
                to: 0
              datasourceUid: grafanacloud-prom
              model:
                expr: sum(increase(learningx_deliveries_total{kind="webpush"}[24h]))
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                refId: D
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0.3
                        type: gt
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: Error
          for: 5m
          annotations:
            description: 실패 {{ with $values.B }}{{ humanize .Value }}{{ end }}건 / 전체 {{ with $values.D }}{{ humanize .Value }}{{ end }}건
            summary: 최근 24시간 브라우저 푸시 전송이 30% 넘게 실패했어요. VAPID 키, 푸시 서비스 응답, 만료된 구독(push_subscription_gone)을 확인하세요.
          labels:
            service: learningx-alert
          isPaused: false
          notification_settings:
            receiver: Discord
        - uid: lx-restore-drill-ok
          title: 월간 복원 연습 성공
          condition: C
          data:
            - refId: A
              queryType: instant
              relativeTimeRange:
                from: 3600
                to: 0
              datasourceUid: grafanacloud-logs
              model:
                expr: sum(count_over_time({service_name="learningx-alert-ops"} |= "restore drill ok" [1h]))
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                queryType: instant
                refId: A
            - refId: B
              queryType: instant
              relativeTimeRange:
                from: 3600
                to: 0
              datasourceUid: grafanacloud-logs
              model:
                expr: max(max_over_time({service_name="learningx-alert-ops"} |= "restore drill ok" | regexp `rows=(?P<v>[0-9]+)` | unwrap v [1h]))
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                queryType: instant
                refId: B
            - refId: D
              queryType: instant
              relativeTimeRange:
                from: 3600
                to: 0
              datasourceUid: grafanacloud-logs
              model:
                expr: max(max_over_time({service_name="learningx-alert-ops"} |= "restore drill ok" | regexp `tables=(?P<v>[0-9]+)` | unwrap v [1h]))
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                queryType: instant
                refId: D
            - refId: E
              queryType: instant
              relativeTimeRange:
                from: 3600
                to: 0
              datasourceUid: grafanacloud-logs
              model:
                expr: max(max_over_time({service_name="learningx-alert-ops"} |= "restore drill ok" | regexp `restore_seconds=(?P<v>[0-9]+)` | unwrap v [1h]))
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                queryType: instant
                refId: E
            - refId: F
              queryType: instant
              relativeTimeRange:
                from: 3600
                to: 0
              datasourceUid: grafanacloud-logs
              model:
                expr: max(max_over_time({service_name="learningx-alert-ops"} |= "restore drill ok" | regexp `differences=(?P<v>[0-9]+)` | unwrap v [1h]))
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                queryType: instant
                refId: F
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0
                        type: gt
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: Error
          annotations:
            description: 테이블 {{ with $values.D }}{{ humanize .Value }}{{ end }}개, {{ with $values.B }}{{ humanize .Value }}{{ end }}행, 복원 {{ with $values.E }}{{ humanize .Value }}{{ end }}초, 행 수가 다른 테이블 {{ with $values.F }}{{ humanize .Value }}{{ end }}개 (백업 뒤 쌓인 데이터면 정상)
            summary: 이번 달 백업 복원 연습이 성공했어요. 최신 백업을 임시 DB에 복원해 운영 DB와 행 수를 비교했어요.
          labels:
            service: learningx-alert
          isPaused: false
          notification_settings:
            receiver: Discord
        - uid: lx-restore-drill-failed
          title: 월간 복원 연습 실패
          condition: C
          data:
            - refId: A
              queryType: instant
              relativeTimeRange:
                from: 3600
                to: 0
              datasourceUid: grafanacloud-logs
              model:
                expr: sum(count_over_time({service_name="learningx-alert-ops"} |= "restore drill failed" [1h]))
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                queryType: instant
                refId: A
            - refId: B
              queryType: instant
              relativeTimeRange:
                from: 3600
                to: 0
              datasourceUid: grafanacloud-logs
              model:
                expr: max(max_over_time({service_name="learningx-alert-ops"} |= "restore drill failed" | regexp `exit_code=(?P<v>[0-9]+)` | unwrap v [1h]))
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                queryType: instant
                refId: B
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0
                        type: gt
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: Error
          annotations:
            description: 종료 코드 {{ with $values.B }}{{ humanize .Value }}{{ end }}
            summary: 백업 복원 연습이 실패했어요. VM에서 journalctl -u learningx-alert-restore-drill로 원인을 확인하세요.
          labels:
            service: learningx-alert
          isPaused: false
          notification_settings:
            receiver: Discord
