{% comment %}
  Floating "의견 보내기" button + dialog. Without JS the link opens the
  feedback page; with JS (app.js) it opens the dialog and posts in place.
{% endcomment %}
<a class="feedback-fab" href="{% url 'feedback' %}?from={{ request.path|urlencode }}" data-feedback-open aria-haspopup="dialog">
  <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v8a2.5 2.5 0 0 1-2.5 2.5H10l-4.2 3.4c-.5.4-1.3 0-1.3-.6V16A2.5 2.5 0 0 1 4 13.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
  <span>의견 보내기</span>
</a>

<dialog class="feedback-dialog" data-feedback-dialog aria-labelledby="feedback-dialog-title">
  <form method="post" action="{% url 'feedback' %}" data-feedback-form>
    {% csrf_token %}
    <div class="feedback-dialog-head">
      <h2 id="feedback-dialog-title">의견 보내기</h2>
      <button class="text-button" type="button" data-feedback-close aria-label="닫기">×</button>
    </div>
    <div data-feedback-fields>
      {% include "accounts/_feedback_fields.html" %}
      <input type="hidden" name="page_path" value="{{ request.path }}">
      <input type="hidden" name="standalone" value="" data-feedback-standalone>
      <p class="fine-print feedback-error" data-feedback-error role="alert" hidden></p>
      <div class="feedback-actions">
        <button class="secondary-button" type="button" data-feedback-close>취소</button>
        <button class="primary-button" type="submit">보내기</button>
      </div>
    </div>
    <div class="feedback-done" data-feedback-done hidden>
      <p><strong>보내 주셔서 고마워요.</strong></p>
      <p class="fine-print">확인하고 고칠게요. 답이 필요하면 가입한 이메일로 연락드릴게요.</p>
      <div class="feedback-actions">
        <button class="primary-button" type="button" data-feedback-close>닫기</button>
      </div>
    </div>
  </form>
</dialog>
